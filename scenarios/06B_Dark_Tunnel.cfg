#textdomain wesnoth-Electrifyre

[scenario]
    id=06B_Dark_Tunnel
    name=_"Dark Tunnel"
    next_scenario=07B_Lake_in_the_Depths

    map_file=06B_Dark_Tunnel.map

    victory_when_enemies_defeated=no
    {TURNS 44 42 40}
    {CAMPAIGN_XP_MODIFIER}

    {DEFAULT_MUSIC_PLAYLIST}
    {UNDERGROUND_VOLCANO -27 -37 -37}
    {UNDERGROUND_VOLCANO -28 -38 -38}
    {UNDERGROUND_VOLCANO -32 -42 -42}
    {UNDERGROUND_VOLCANO -36 -46 -46}
    {UNDERGROUND_VOLCANO -37 -47 -47}
    {UNDERGROUND_VOLCANO -36 -46 -46}
    {UNDERGROUND_VOLCANO -32 -42 -42}
    {UNDERGROUND_VOLCANO -28 -38 -38}

    {STORY_SIX_B}

    # side: player
    [side]
        side=1
        controller=human
        
        {CHARACTER_STATS:HIKARU}
        facing=se

        {FACTION_SIDE:ARAGWAITHI}
        recruit={RECRUITS:ARAGWAITHI}

        fog=yes
        shroud=yes
        share_vision=none

        {GOLD 50 40 25}
        {INCOME 2 1 0}
    [/side]

    # side: aragwaithi
    [side]
        side=2
        controller=ai
        no_leader=yes

        team_name="aragwaithi","allies"
        user_team_name=_"team_name^Aragwaithi"
        {FLAG_VARIANT long}
        color=purple

        {NO_RECRUITMENT}

        fog=yes
        shroud=yes
        share_vision=all

        gold=0
        income=-2

        [ai]
            {AI_SIMPLE_ALWAYS_ASPECT grouping offensive}
            {AI_SIMPLE_ALWAYS_ASPECT aggression 0.55}
            {AI_SIMPLE_ALWAYS_ASPECT caution 0.30}
            {AI_SIMPLE_ALWAYS_ASPECT passive_leader yes}
            # add more stronger AI params
            {AI_SIMPLE_ALWAYS_ASPECT recruitment_diversity 0.8}
            {AI_SIMPLE_ALWAYS_ASPECT recruitment_randomness 0}
            {AI_SIMPLE_ALWAYS_ASPECT villages_per_scout 0}
            {AI_ASPECT recruitment_save_gold {AI_DEACTIVATE_SAVE_GOLD} }
        [/ai]
    [/side]

    # side: monsters
    [side]
        side=3
        controller=ai
        no_leader=yes

        {FACTION_SIDE:MONSTERS}

        {NO_ECONOMY}
        {NO_RECRUITMENT}

        {HIDDEN_SIDE}
    [/side]

    # prestart event
    [event]
        name="prestart"

        {RECALL Soryu}
        {RECALL Eikichi}

        [unit]
            x,y=32,5
            side=2
            {CHARACTER_STATS:AYANAMI}
        [/unit]

        # adjust recall costs
        {ADJUST_RECALL_COST}
    [/event]

    # allow player to control Ayanami
    {AI_CONTROLLER_ALLOW_MOVEMENT_CONTROL "Ayanami" 2}

    # start event
    [event]
        name="start"
    [/event]

    

    # player units death event
    {DEFEAT_EVENT:HIKARU}
    {DEFEAT_EVENT:SORYU}
    {DEATH_EVENT:AYANAMI}
[/scenario]