#textdomain wesnoth-Electrifyre

[scenario]
    id=07B_Lake_in_the_Depths
    name=_"Lake in the Depths"
    next_scenario=07XB_Windsong_and_Deep_Elves

    map_file=07B_Lake_in_the_Depths.map

    victory_when_enemies_defeated=no
    {TURNS 24 22 20}
    {CAMPAIGN_XP_MODIFIER}

    {DEFAULT_MUSIC_PLAYLIST}
    {DEEP_UNDERGROUND}

    {STORY_SEVEN_B}

    # side: player
    [side]
        side=1
        controller=human
        
        {CHARACTER_STATS:HIKARU}
        facing=se

        {FACTION_SIDE:ARAGWAITHI}
        recruit={RECRUITS:ARAGWAITHI}

        fog=yes
        shroud=yes
        share_vision=none

        {GOLD 50 40 25}
        {INCOME 2 1 0}
    [/side]

    # side: aragwaithi
    [side]
        side=2
        controller=ai
        no_leader=yes

        team_name="aragwaithi","allies"
        user_team_name=_"team_name^Aragwaithi"
        {FLAG_VARIANT long}
        color=purple

        {NO_RECRUITMENT}

        fog=yes
        shroud=yes
        share_vision=all

        gold=0
        income=-2

        [ai]
            {AI_SIMPLE_ALWAYS_ASPECT grouping offensive}
            {AI_SIMPLE_ALWAYS_ASPECT aggression 0.55}
            {AI_SIMPLE_ALWAYS_ASPECT caution 0.30}
            {AI_SIMPLE_ALWAYS_ASPECT passive_leader yes}
            # add more stronger AI params
            {AI_SIMPLE_ALWAYS_ASPECT recruitment_diversity 0.8}
            {AI_SIMPLE_ALWAYS_ASPECT recruitment_randomness 0}
            {AI_SIMPLE_ALWAYS_ASPECT villages_per_scout 0}
            {AI_ASPECT recruitment_save_gold {AI_DEACTIVATE_SAVE_GOLD} }
        [/ai]
    [/side]

    # side: monsters
    [side]
        side=3
        controller=ai
        no_leader=yes

        {FACTION_SIDE:MONSTERS}

        {NO_ECONOMY}
        {NO_RECRUITMENT}

        {HIDDEN_SIDE}
    [/side]

    # prestart event
    [event]
        name="prestart"

        {RECALL Soryu}
        {RECALL Eikichi}

        # adjust recall costs
        {ADJUST_RECALL_COST}

        {VARIABLE great_sea_dragon_defeated no}
    [/event]

    # allow player to control Ayanami
    {AI_CONTROLLER_ALLOW_MOVEMENT_CONTROL "Ayanami" 2}

    # start event
    [event]
        name="start"
    [/event]

    # event: moveto
    {PLACE_IMAGE "items/gohere.png" 49 33}
    {PLACE_IMAGE "items/gohere.png" 48 33}
    [event]
        name="moveto"
        first_time_only=yes

        [filter]
            side=1
            x=48,49
            y=33,33
            id="Ayanami"
        [/filter]

        [filter_condition]
            {VARIABLE_CONDITIONAL great_sea_dragon_defeated equals yes}
        [/filter_condition]

        {SIMPLE_MSG "Ayanami" (_"We have made it across the subterranean lake! Let us get going!")}

        {SIMPLE_MSG "Hikaru" (_"Indeed, we should pitch camp soon.")}

        {MODIFY_UNIT (id="Ayanami") side 1}

        {ENDLEVEL_VICTORY yes 30}
    [/event]

    # exquisite bow
    {ITEM_ANCIENT_EXQUISITE_LONGBOW 13 31}

    # player units death event
    {DEFEAT_EVENT:HIKARU}
    {DEFEAT_EVENT:SORYU}
    {DEATH_EVENT:AYANAMI}
[/scenario]