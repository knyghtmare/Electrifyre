#textdomain wesnoth-Electrifyre

[scenario]
    id=07B_Lake_in_the_Depths
    name=_"Lake in the Depths"
    next_scenario=07X_Windsong_and_Deep_Elves

    map_file=07B_Lake_in_the_Depths.map

    victory_when_enemies_defeated=no
    {TURNS 24 22 20}
    {CAMPAIGN_XP_MODIFIER}

    {DEFAULT_MUSIC_PLAYLIST}
    {DEEP_UNDERGROUND}

    {STORY_SEVEN_B}

    # side: player
    [side]
        side=1
        controller=human
        
        {CHARACTER_STATS:HIKARU}
        facing=se

        {FACTION_SIDE:ARAGWAITHI}
        recruit={RECRUITS:ARAGWAITHI}

        fog=yes
        shroud=yes
        share_vision=none

        {GOLD 50 40 25}
        {INCOME 2 1 0}
    [/side]

    # prestart event
    [event]
        name="prestart"

        {RECALL Soryu}
        {RECALL Eikichi}

        # adjust recall costs
        {ADJUST_RECALL_COST}

        {VARIABLE great_sea_dragon_defeated no}
    [/event]

    # start event
    [event]
        name="start"
    [/event]

    # event: moveto
    {PLACE_IMAGE "items/gohere.png" 49 33}
    {PLACE_IMAGE "items/gohere.png" 48 33}
    [event]
        name="moveto"
        first_time_only=yes

        [filter]
            side=1
            x=48,49
            y=33,33
            id="Ayanami"
        [/filter]

        [filter_condition]
            {VARIABLE_CONDITIONAL great_sea_dragon_defeated equals yes}
        [/filter_condition]

        {SIMPLE_MSG "Ayanami" (_"We have made it across the subterranean lake! Let us get going!")}

        {SIMPLE_MSG "Hikaru" (_"Indeed, we should pitch camp soon.")}

        {ENDLEVEL_VICTORY yes 30}
    [/event]
    

    # player units death event
    {DEFEAT_EVENT:HIKARU}
    {DEFEAT_EVENT:SORYU}
    {DEATH_EVENT:AYANAMI}
[/scenario]