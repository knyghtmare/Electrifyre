#textdomain wesnoth-Electrifyre

[scenario]
    id=07XB_Windsong_and_Deep_Elves
    name=_"Windsong and Deep Elves"
    next_scenario=08B_Maw_of_the_Hive
    theme=Cutscene

    map_file=cutscenes/07XB_Windsong_and_Deep_Elves.map

    victory_when_enemies_defeated=no
    turns=-1
    {CAMPAIGN_XP_MODIFIER}

    {DEFAULT_MUSIC_PLAYLIST}

    # we have descended further into the depths
    {DEEP_UNDERGROUND}

    {STORY_SEVEN_CUTSCENE}

    # side: player
    [side]
        side=1
        controller=human
        
        {CHARACTER_STATS:HIKARU}
        facing=se

        {FACTION_SIDE:ARAGWAITHI}
        recruit={RECRUITS:ARAGWAITHI}

        fog=no
        shroud=no
        share_vision=all

        {GOLD 50 40 25}
        {INCOME 2 1 0}
    [/side]

    # side: aragwaithi
    [side]
        side=2
        controller=ai
        no_leader=yes

        team_name="aragwaithi","allies"
        user_team_name=_"team_name^Aragwaithi"
        {FLAG_VARIANT long}
        color=purple

        {NO_RECRUITMENT}
        hidden=yes

        fog=no
        shroud=no
        share_vision=all

        gold=0
        income=-2

        [ai]
            {AI_SIMPLE_ALWAYS_ASPECT grouping offensive}
            {AI_SIMPLE_ALWAYS_ASPECT aggression 0.55}
            {AI_SIMPLE_ALWAYS_ASPECT caution 0.30}
            {AI_SIMPLE_ALWAYS_ASPECT passive_leader yes}
            # add more stronger AI params
            {AI_SIMPLE_ALWAYS_ASPECT recruitment_diversity 0.8}
            {AI_SIMPLE_ALWAYS_ASPECT recruitment_randomness 0}
            {AI_SIMPLE_ALWAYS_ASPECT villages_per_scout 0}
            {AI_ASPECT recruitment_save_gold {AI_DEACTIVATE_SAVE_GOLD} }
        [/ai]
    [/side]

    # side: deep elves
    [side]
        side=3
        controller=ai
        no_leader=yes

        team_name="aragwaithi"
        user_team_name=_"team_name^Deep Elves"
        {FLAG_VARIANT long}
        color=orange

        {NO_RECRUITMENT}
        {NO_ECONOMY}
        {HIDDEN_SIDE}
    [/side]

    # side: windsong
    [side]
        side=4
        controller=ai
        no_leader=yes

        team_name="aragwaithi"
        user_team_name=_"team_name^Windsong"
        {FLAG_VARIANT long}
        color=red

        {NO_RECRUITMENT}
        {NO_ECONOMY}
        {HIDDEN_SIDE}
    [/side]

    # prestart event
    [event]
        name="prestart"

        {RECALL Soryu}
        {RECALL Ayanami}
        # this is a cutscene
        # {RECALL Eikichi}

        # adjust recall costs
        {ADJUST_RECALL_COST}
    [/event]

    # start event
    [event]
        name="start"

        {MOVE_UNIT (id="Hikaru") 3 3}{DELAY 150}{REDRAW}
        {MOVE_UNIT (id="Soryu") 2 3}{DELAY 150}{REDRAW}
        {MOVE_UNIT (id="Hikaru") 5 5}{DELAY 150}{REDRAW}
        {MOVE_UNIT (id="Soryu") 4 4}{DELAY 150}{REDRAW}

        # {ENDLEVEL_CUTSCENE}
    [/event]

[/scenario]