    map_file=cutscenes/07X_Windsong_and_Deep_Elves.map

    victory_when_enemies_defeated=no
    turns=-1
    {CAMPAIGN_XP_MODIFIER}

    {DEFAULT_MUSIC_PLAYLIST}

    # we have descended further into the depths
    {DEEP_UNDERGROUND}

    {STORY_SEVEN_CUTSCENE}

    # side: player
    [side]
        side=1
        controller=human
        
        {CHARACTER_STATS:HIKARU}
        facing=se

        {FACTION_SIDE:ARAGWAITHI}
        recruit={RECRUITS:ARAGWAITHI}

        fog=no
        shroud=yes
        share_vision=all

        {GOLD 50 40 25}
        {INCOME 2 1 0}
    [/side]

    # prestart event
    [event]
        name="prestart"

        {RECALL Soryu}
        # this is a cutscene
        # {RECALL Eikichi}

        # adjust recall costs
        {ADJUST_RECALL_COST}
    [/event]

    # start event
    [event]
        name="start"

        # {ENDLEVEL_CUTSCENE}
    [/event]

[/scenario]